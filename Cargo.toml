[package]
name = "bootwitness"
version = "0.1.1"
edition = "2021"
rust-version = "1.85"
description = "Durable Linux boot-continuity monitor"
license = "MIT"
repository = "https://github.com/FibreCase/bootwitness"

[dependencies]
anyhow = "=1.0.86"
chrono = { version = "=0.4.38", default-features = false, features = ["std"] }
clap = { version = "=4.5.16", features = ["derive"] }
ctrlc = "=3.4.5"
libc = "=0.2.158"
rusqlite = { version = "=0.32.1", features = ["bundled"] }
serde = { version = "=1.0.209", features = ["derive"] }
serde_json = "=1.0.127"

[profile.release]
lto = "thin"
strip = "symbols"

[package.metadata.deb]
maintainer = "bootwitness maintainers"
section = "admin"
priority = "optional"
depends = "$auto"
assets = [
  ["target/release/bootwitness", "usr/bin/", "755"],
  ["packaging/systemd/bootwitness.service", "usr/lib/systemd/system/", "644"],
  ["README.md", "usr/share/doc/bootwitness/README.md", "644"],
  ["LICENSE", "usr/share/doc/bootwitness/LICENSE", "644"],
]
